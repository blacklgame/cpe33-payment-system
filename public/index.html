<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment System - Enter Nu ID</title>
  <!-- Google Fonts: Inter & Noto Sans Thai -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+Thai:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header>
    <div class="brand">
      <span class="badge">CPE</span>
      <span class="version">33</span>
    </div>
    <a href="index.html" class="nav-link">หน้าหลัก</a>
  </header>

  <!-- Main Content -->
  <main>
    <h1>Payment System</h1>
    <p class="subtitle">Please Enter Your Nu ID</p>

    <!-- Form Container -->
    <form class="form-container" id="loginForm" action="#" method="POST" autocomplete="off">
      <input 
        type="text" 
        class="input-field" 
        id="nuid"
        name="nuid"
        aria-label="Nu ID Input"
        placeholder="เช่น 693xxxxx"
        inputmode="numeric"
        maxlength="8"
        autofocus
      />
      <p class="error-text" id="errorText"></p>
      <button type="submit" class="btn-enter" id="enterBtn">Enter</button>
    </form>
  </main>

  <script type="module" src="index.js"></script>
</body>
</html>
