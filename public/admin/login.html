<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Payment System</title>
  <!-- Google Fonts: Inter & Noto Sans Thai -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+Thai:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', 'Noto Sans Thai', sans-serif;
    }

    body {
      background-color: #0b1524;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Navbar */
    header {
      width: 100%;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge {
      background-color: #ffffff;
      color: #000000;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 1.1rem;
    }

    .version {
      font-size: 1.2rem;
      font-weight: 600;
      color: #ffffff;
    }

    .nav-link {
      color: #ffffff;
      text-decoration: none;
      font-size: 1.2rem;
      font-weight: 400;
    }

    .nav-link:hover {
      opacity: 0.8;
    }

    /* Main Content Container */
    main {
      width: 100%;
      max-width: 500px;
      padding: 80px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 1.2rem;
      font-weight: 300;
      color: #ffffff;
      margin-bottom: 28px;
    }

    /* Google Sign-in Button */
    .btn-google {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      max-width: 360px;
      background-color: #435e7d;
      color: #ffffff;
      border: none;
      border-radius: 25px;
      padding: 12px 24px;
      font-size: 1.15rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn-google:hover {
      background-color: #4d6b8e;
    }

    .btn-google:active {
      transform: scale(0.98);
    }

    /* Google G Logo Badge Container */
    .google-icon-wrapper {
      width: 32px;
      height: 32px;
      background-color: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .google-icon-wrapper svg {
      width: 18px;
      height: 18px;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header>
    <div class="brand">
      <span class="badge">CPE</span>
      <span class="version">33</span>
    </div>
    <a href="../index.html" class="nav-link">หน้าหลัก</a>
  </header>

  <!-- Main Content -->
  <main>
    <h1>Admin Page</h1>
    <p class="subtitle">Please sign in with your @nu.ac.th account</p>

    <!-- Sign-in Button -->
    <button type="button" class="btn-google">
      <span class="google-icon-wrapper">
        <svg viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
      </span>
      <span>Sign in with NU Account</span>
    </button>
    <p id="errorText" style="color:#ff6b6b; margin-top:16px; font-size:0.95rem;"></p>
  </main>

  <script type="module" src="admin.js"></script>
</body>
</html>
