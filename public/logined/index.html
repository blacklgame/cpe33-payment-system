<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment System</title>
  <!-- Google Fonts: Inter & Noto Sans Thai -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+Thai:wght@300;400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header>
    <div class="brand">
      <span class="badge">CPE</span>
      <span class="version">33</span>
    </div>
    <nav class="nav-links">
      <a href="../stats/index.html" class="nav-link">Stats</a>
      <a href="#" class="nav-link" id="logoutLink">ออกจากระบบ</a>
    </nav>
  </header>

  <!-- Main Content -->
  <main>
    <h1>Payment System</h1>

    <!-- User Profile Card -->
    <div class="card profile-card">
      <div class="avatar-placeholder"></div>
      <div class="user-name" id="userName">-</div>
      <div class="user-email" id="userEmail">-</div>
    </div>

    <!-- Bank Account Card -->
    <div class="card bank-card">
      <p class="bank-line"><span class="bank-label">ธนาคาร:</span> กสิกรไทย</p>
      <p class="bank-line"><span class="bank-label">ชื่อบัญชี:</span> นาย ณัฐพัชร์ เบ้าตุ้ม</p>
      <p class="bank-line"><span class="bank-label">เลขบัญชี:</span> 1331-303-980</p>
    </div>

    <!-- Upload Payment Slip Card -->
    <div class="card upload-card">
      <h2>แนบหลักฐานการชำระเงิน (Upload Slip)</h2>
      <p class="hint">เลือกรูปภาพสลิปการโอนเงินจากอุปกรณ์ของคุณ แล้วกดส่ง</p>

      <div class="upload-row">
        <label for="fileInput" class="btn-choose">Choose File</label>
        <input type="file" id="fileInput" class="file-input" accept="image/*">
        <span class="file-name" id="fileName">ยังไม่ได้เลือกไฟล์</span>
      </div>

      <div class="preview-wrap" id="previewWrap">
        <img class="preview-img" id="previewImg" alt="Selected slip preview">
      </div>

      <button type="button" class="btn-send" id="sendBtn" disabled>ส่ง (Send)</button>
      <p class="status-text" id="statusText"></p>
    </div>
  </main>

  <script type="module" src="index.js"></script>
</body>
</html>
