<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Stat - Payment System</title>
  <!-- Google Fonts: Inter & Noto Sans Thai -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header>
    <div class="brand">
      <span class="badge">CPE</span>
      <span class="version">33</span>
    </div>

    <div class="welcome-msg" id="welcomeMsg">Welcome</div>

    <nav class="nav-links">
      <a href="../index.html" class="nav-link">หน้าหลัก</a>
      <a href="#" class="nav-link" id="logoutLink">ออกจากระบบ</a>
    </nav>
  </header>

  <!-- Main Content: hidden until auth is confirmed in dashboard.js -->
  <main id="mainContent" style="display:none;">
    <h1>Stat</h1>

    <p id="loadingText" style="opacity:0.7;">กำลังโหลดรายชื่อ...</p>

    <div class="toolbar" id="toolbar" style="display:none;">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <circle cx="11" cy="11" r="7"/>
          <path d="M21 21l-4.35-4.35"/>
        </svg>
        <input type="text" id="searchInput" class="search-input" placeholder="ค้นหา: รหัสนิสิต, 3 ตัวท้าย, หรือชื่อ...">
        <button type="button" id="searchClear" class="search-clear">✕</button>
      </div>
      <button type="button" id="pendingFilterToggle" class="pending-filter-btn">รอตรวจสอบ (Pending approval)</button>
      <div class="pagination" id="pagination"></div>
      <div class="search-results-info" id="searchResultsInfo" style="display:none;"></div>
    </div>

    <div id="rowsContainer"></div>
  </main>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
